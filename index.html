<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#526b51">
  <title>自学ログ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div>
        <p class="eyebrow">MY STUDY LOG</p>
        <h1>自学ログ</h1>
        <p class="subtitle">自分の言葉で、学びを残す。</p>
      </div>
      <button id="userButton" class="user-button hidden" type="button">
        <span>●</span><span id="currentUserName"></span><span>⌄</span>
      </button>
    </header>

    <main>
      <section id="welcome" class="card welcome">
        <div class="mark">自</div>
        <h2>自学ログへようこそ</h2>
        <p>まず、この端末で使うユーザー名を登録します。</p>
        <form id="firstUserForm">
          <label for="firstUserName">ユーザー名</label>
          <input id="firstUserName" maxlength="30" placeholder="例：わたし" required>
          <button class="primary" type="submit">はじめる</button>
        </form>
      </section>

      <section id="home" class="hidden">
        <p class="eyebrow">HOME</p>
        <h2>こんにちは、<span id="homeUserName"></span>さん</h2>

        <div class="card">
          <div class="number">01</div>
          <div>
            <h3>自学ログ</h3>
            <p>ここに、あなたの学びが積み重なっていきます。</p>
            <small>ログの入力機能はSTEP 2で追加します。</small>
          </div>
        </div>

        <div class="card info">
          <h3>STEP 1でできること</h3>
          <ul>
            <li>この端末にユーザーを登録する</li>
            <li>ユーザーごとにデータを分けて保存する</li>
            <li>ユーザーを切り替える</li>
            <li>あとからユーザーを追加する</li>
          </ul>
        </div>
      </section>
    </main>
  </div>

  <div id="panel" class="overlay hidden">
    <div class="backdrop" id="closePanel"></div>
    <section class="panel">
      <div class="panel-head">
        <div>
          <p class="eyebrow">USER</p>
          <h2>ユーザー</h2>
        </div>
        <button id="closeButton" class="close" type="button">×</button>
      </div>

      <div id="userList" class="user-list"></div>

      <form id="addUserForm">
        <label for="newUserName">ユーザーを追加</label>
        <div class="add-row">
          <input id="newUserName" maxlength="30" placeholder="ユーザー名">
          <button class="secondary" type="submit">追加</button>
        </div>
        <p id="message" class="message"></p>
      </form>

      <p class="storage">ユーザー情報は、このブラウザの端末内に保存されます。</p>
    </section>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
